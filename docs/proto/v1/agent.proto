syntax = "proto3";

package grpc.v1;

option go_package = "docs/proto/v1";

// AgentService provides RPCs for agent execution and status querying.
service AgentService {
  // Execute starts a new agent workflow run.
  rpc Execute(ExecuteRequest) returns (RunStatus);
  // GetStatus queries the current status of an agent run.
  rpc GetStatus(GetStatusRequest) returns (RunStatus);
}

// ExecuteRequest is the payload for starting an agent run.
message ExecuteRequest {
  string run_id = 1;
  string account_id = 2;
  string agent_id = 3;
  string user_message = 4;
  string model_ref = 5;
  string system_prompt = 6;
  string thread_id = 7;
  string project_id = 8;
  bool bypass_admission = 9;
  string idempotency_key = 10;
}

// GetStatusRequest requests the status of a run by its ID.
message GetStatusRequest {
  string run_id = 1;
}

// RunStatus is the execution status of an agent run.
message RunStatus {
  string run_id = 1;
  string lifecycle_state = 2;
  int32 step = 3;
  string reason = 4;
  int64 updated_at = 5; // Unix timestamp in seconds
}
