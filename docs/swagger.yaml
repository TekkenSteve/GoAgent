host: localhost:8080
info:
  contact: {}
  description: Agent Framework API
  title: GoAgent API
  version: "1.0"
paths:
  /agentos/plans:
    post:
      consumes:
      - application/json
      description: Start a durable cross-backend AgentOS RunPlan.
      operationId: agentos-start-plan
      parameters:
      - description: AgentOS run plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentos.RunPlanSpec'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/agentos.RunPlanStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Start AgentOS plan
      tags:
      - agentos
  /agentos/plans/{plan_id}/artifacts:
    get:
      consumes:
      - application/json
      description: Query durable artifact refs for a RunPlan.
      operationId: agentos-list-plan-artifacts
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Node ID
        in: query
        name: node_id
        type: string
      - description: Child run ID
        in: query
        name: run_id
        type: string
      - description: Maximum refs
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agentos.ArtifactRef'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List AgentOS plan artifacts
      tags:
      - agentos
  /agentos/plans/{plan_id}/artifacts/{artifact_id}:
    get:
      consumes:
      - application/json
      description: Read one durable artifact document for a RunPlan.
      operationId: agentos-get-plan-artifact
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agentos.Artifact'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get AgentOS plan artifact
      tags:
      - agentos
  /agentos/plans/{plan_id}/audits:
    get:
      consumes:
      - application/json
      description: Query durable audit records for plan control-plane actions.
      operationId: agentos-list-plan-audits
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Node ID
        in: query
        name: node_id
        type: string
      - description: Child run ID
        in: query
        name: run_id
        type: string
      - description: Audit action
        in: query
        name: action
        type: string
      - description: Maximum records
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
