host: localhost:8080
info:
  contact: {}
  description: Agent Framework API
  title: GoAgent API
  version: "1.0"
paths:
  /agentos/actions:
    get:
      consumes:
      - application/json
      description: Query governed action projections for a tenant, process, resource,
        kind, or lifecycle state.
      operationId: agentos-list-actions
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Process ID
        in: query
        name: process_id
        type: string
      - description: Resource kind
        in: query
        name: resource_kind
        type: string
      - description: Resource ID
        in: query
        name: resource_id
        type: string
      - description: Action kind
        in: query
        name: kind
        type: string
      - description: Lifecycle state
        in: query
        name: lifecycle_state
        type: string
      - description: Maximum actions
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.GovernedActionStatus'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List AgentOS governed actions
      tags:
      - agentos
    post:
      consumes:
      - application/json
      description: Request one governed action with durable dry-run, approval, and
        execution state.
      operationId: agentos-request-action
      parameters:
      - description: Governed action request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.GovernedActionSpec'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.GovernedActionStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Request AgentOS governed action
      tags:
      - agentos
  /agentos/actions/{action_id}:
    get:
      consumes:
      - application/json
      description: Query one governed action projection.
      operationId: agentos-action-status
      parameters:
      - description: Action ID
        in: path
        name: action_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.GovernedActionStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get AgentOS governed action status
      tags:
      - agentos
  /agentos/actions/{action_id}/approval:
    post:
      consumes:
      - application/json
      description: Record a governed action approval decision.
      operationId: agentos-resolve-action-approval
      parameters:
      - description: Action ID
        in: path
        name: action_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Approval decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.ActionApprovalDecision'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TekkenSteve_GoAgent_agentos_process.GovernedActionStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Resolve AgentOS action approval
      tags:
      - agentos
  /agentos/actions/{action_id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancel one governed action.
      operationId: agentos-cancel-action
      parameters:
      - description: Action ID
        in: path
        name: action_id
        required: true
