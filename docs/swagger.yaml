host: localhost:8080
info:
  contact: {}
  description: Agent Framework API
  title: GoAgent API
  version: "1.0"
paths:
  /agentos/plans:
    post:
      consumes:
      - application/json
      description: Start a durable cross-backend AgentOS RunPlan.
      operationId: agentos-start-plan
      parameters:
      - description: AgentOS run plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentos.RunPlanSpec'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/agentos.RunPlanStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Start AgentOS plan
      tags:
      - agentos
  /agentos/plans/{plan_id}/audits:
    get:
      consumes:
      - application/json
      description: Query durable audit records for plan control-plane actions.
      operationId: agentos-list-plan-audits
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        type: string
      - description: Node ID
        in: query
        name: node_id
        type: string
      - description: Child run ID
        in: query
        name: run_id
        type: string
      - description: Audit action
        in: query
        name: action
        type: string
      - description: Maximum records
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agentos.PlanAuditRecord'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: List AgentOS plan audits
      tags:
      - agentos
  /agentos/plans/{plan_id}/control:
    post:
      consumes:
      - application/json
      description: Send lifecycle control such as pause, resume, or cancel to an AgentOS
        RunPlan.
      operationId: agentos-control-plan
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: AgentOS plan control operation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AgentOSPlanControl'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Control AgentOS plan
      tags:
      - agentos
  /agentos/plans/{plan_id}/events:
    get:
      consumes:
      - application/json
      description: Stream durable RunPlan events as Server-Sent Events.
      operationId: agentos-stream-plan-events
      parameters:
      - description: Plan ID
        in: path
        name: plan_id
        required: true
        type: string
      - description: Node ID
        in: query
        name: node_id
        type: string
      - description: Child run ID
        in: query
        name: run_id
        type: string
      - description: Replay events after this sequence
        in: query
        name: after_sequence
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
