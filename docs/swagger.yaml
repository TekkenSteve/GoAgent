    type: object
  control.PlanTopologyNode:
    properties:
      backend:
        $ref: '#/definitions/control.BackendRef'
      capability:
        type: string
      conditions:
        items:
          type: string
        type: array
      inputs:
        items:
          $ref: '#/definitions/control.InputMapping'
        type: array
      node_id:
        type: string
      outputs:
        items:
          $ref: '#/definitions/control.ArtifactSpec'
        type: array
      policy:
        $ref: '#/definitions/control.NodePolicy'
      run_id:
        type: string
      status:
        $ref: '#/definitions/control.PlanNodeStatus'
    type: object
  control.RunPlanStatus:
    properties:
      active_run_ids:
        items:
          type: string
        type: array
      approval:
        allOf:
        - $ref: '#/definitions/control.PlanApprovalStatus'
        description: |-
          Approval is the live approval-gate projection. It is nil while no gate
          is active: a plan that is not blocked, or a blocked plan persisted before
          the auditable-approval feature (the decision is then derived lazily).
      artifacts:
        items:
          $ref: '#/definitions/core.ArtifactRef'
        type: array
      blocked_at:
        description: |-
          BlockedAt records when the plan entered the blocked (awaiting-approval)
          lifecycle state. It is zero outside the blocked state and anchors the
          ApprovalTimeoutSeconds gate.
        type: string
      budget_usage:
        $ref: '#/definitions/control.PlanBudgetUsage'
      lifecycle_state:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      nodes:
        items:
          $ref: '#/definitions/control.PlanNodeStatus'
        type: array
      plan_id:
        type: string
      reason:
        type: string
      started_at:
        type: string
      updated_at:
        type: string
