basePath: /v1
definitions:
  control.ArtifactSpec:
    properties:
      kind:
        $ref: '#/definitions/core.ArtifactKind'
      media_type:
        type: string
      name:
        type: string
      required:
        type: boolean
      schema_ref:
        type: string
    type: object
  control.BackendKind:
    enum:
    - native
    - temporal_external
    - http
    - grpc
    type: string
    x-enum-varnames:
    - BackendKindNative
    - BackendKindTemporalExternal
    - BackendKindHTTP
    - BackendKindGRPC
  control.BackendRef:
    properties:
      kind:
        $ref: '#/definitions/control.BackendKind'
      name:
        type: string
    type: object
  control.EdgeTrigger:
    enum:
    - success
    - error
    - complete
    - always
    type: string
    x-enum-varnames:
    - EdgeOnSuccess
    - EdgeOnError
    - EdgeOnComplete
    - EdgeOnAlways
  control.InputMapping:
    properties:
      expression:
        type: string
      required:
        type: boolean
      source_artifact:
        type: string
      source_node_id:
        type: string
      source_path:
        type: string
      target:
        type: string
    type: object
  control.NodePolicy:
    properties:
      join:
        $ref: '#/definitions/control.PlanJoinStrategy'
      max_attempts:
        type: integer
      timeout_seconds:
        type: integer
    type: object
  control.PlanApprovalDecision:
    properties:
      actor_id:
        type: string
      approved:
        type: boolean
      decided_at:
        type: string
      policy_version:
        type: string
      reason:
        type: string
    type: object
  control.PlanApprovalGate:
    properties:
      expires_at:
        description: |-
          ExpiresAt is when the gate auto-rejects. Zero means no expiry
          (ApprovalTimeoutSeconds == 0).
        type: string
      node_ids:
        description: |-
          NodeIDs are the precise plan-node references the gate covers: the nodes
          that resume or start once the gate is approved.
        items:
          type: string
        type: array
      policy_version:
        description: |-
          PolicyVersion is a deterministic fingerprint of the plan policy and node
          set at gate creation. It changes when the topology is replanned
          (PlanDelta), which invalidates an existing decision.
        type: string
      requested_at:
        description: RequestedAt is when the gate was created (plan entered blocked).
        type: string
      risk_reason:
        description: RiskReason is the rationale for requiring approval (why the plan
          paused).
        type: string
      summary:
        description: Summary describes what the gate covers (gated node count and
          plan id).
        type: string
    type: object
  control.PlanApprovalStatus:
    properties:
      decision:
        $ref: '#/definitions/control.PlanApprovalDecision'
      gate:
        $ref: '#/definitions/control.PlanApprovalGate'
      lifecycle_state:
        type: string
    type: object
  control.PlanAuditAction:
    enum:
    - plan.start
    - plan.signal
    - plan.control
    type: string
    x-enum-varnames:
    - PlanAuditActionStart
    - PlanAuditActionSignal
    - PlanAuditActionControl
  control.PlanBudgetUsage:
    properties:
      spent_cents:
        type: integer
    type: object
  control.PlanCapabilityTrace:
    properties:
      backend:
        $ref: '#/definitions/control.BackendRef'
      capability:
        type: string
      controls:
        items:
          $ref: '#/definitions/core.ControlOperation'
        type: array
      has_input_schema:
        type: boolean
      has_output_schema:
        type: boolean
      signals:
        items:
          $ref: '#/definitions/core.SignalType'
        type: array
    type: object
  control.PlanConditionTrace:
    properties:
      edge_id:
        type: string
      expression:
        type: string
      from:
        type: string
      node_id:
        type: string
      "on":
        $ref: '#/definitions/control.EdgeTrigger'
      parent_state:
        type: string
      result:
        type: boolean
      scope:
        type: string
      to:
        type: string
    type: object
  control.PlanEdgeSpec:
    properties:
      condition:
        type: string
      edge_id:
        type: string
      from:
        type: string
      input_mapping:
        items:
          $ref: '#/definitions/control.InputMapping'
        type: array
      "on":
        $ref: '#/definitions/control.EdgeTrigger'
      to:
        type: string
    type: object
  control.PlanInputMappingTrace:
    properties:
      expression:
        type: string
      required:
        type: boolean
      source_artifact:
        type: string
      source_node_id:
        type: string
      source_path:
        type: string
      target:
        type: string
    type: object
  control.PlanInputResolutionTrace:
    properties:
      input_digest:
        type: string
      input_keys:
        items:
          type: string
        type: array
      mapping_count:
        type: integer
      mappings:
        items:
          $ref: '#/definitions/control.PlanInputMappingTrace'
        type: array
    type: object
  control.PlanJoinStrategy:
    enum:
    - all
    - any
    - first
    type: string
    x-enum-varnames:
    - PlanJoinAll
    - PlanJoinAny
    - PlanJoinFirst
  control.PlanNodeSpec:
    properties:
      capability:
        type: string
      conditions:
        items:
          type: string
        type: array
      inputs:
        items:
          $ref: '#/definitions/control.InputMapping'
        type: array
      node_id:
        type: string
      outputs:
        items:
          $ref: '#/definitions/control.ArtifactSpec'
        type: array
      policy:
        $ref: '#/definitions/control.NodePolicy'
      run:
        $ref: '#/definitions/control.RunSpec'
    type: object
  control.PlanNodeStatus:
    properties:
      artifacts:
        items:
          $ref: '#/definitions/core.ArtifactRef'
        type: array
      attempts:
        type: integer
      backend:
        $ref: '#/definitions/control.BackendRef'
      budget_usage:
        $ref: '#/definitions/control.PlanBudgetUsage'
      completed_at:
        type: string
      lifecycle_state:
        type: string
      node_id:
        type: string
      reason:
        type: string
      run_id:
        type: string
      started_at:
        type: string
      updated_at:
        type: string
    type: object
  control.PlanPolicy:
    properties:
      approval_timeout_seconds:
        description: |-
          ApprovalTimeoutSeconds bounds how long a plan may stay blocked waiting
          for human approval (approve/reject signal). When it elapses the plan is
          auto-rejected. 0 disables the gate (plan waits indefinitely).
        type: integer
      budget_cents:
        type: integer
      continue_as_new_events:
        type: integer
      max_depth:
        type: integer
      max_expansions:
        type: integer
      max_history_events:
        type: integer
      max_iterations:
        type: integer
      max_nodes:
        type: integer
      max_parallel_nodes:
        type: integer
      timeout_seconds:
        type: integer
    type: object
  control.PlanStateTransition:
    properties:
      next_lifecycle_state:
        type: string
      previous_lifecycle_state:
        type: string
    type: object
  control.PlanTopology:
    properties:
      edges:
        items:
          $ref: '#/definitions/control.PlanTopologyEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/control.PlanTopologyNode'
        type: array
      order:
        items:
          type: string
        type: array
    type: object
  control.PlanTopologyEdge:
