# Production gateway: the only published entry point.
#
# Differences from the development gateway, and why:
#   - TLS terminates here (8443), so the application is never addressed in
#     cleartext from outside;
#   - the gRPC listener is not exposed: an internal control-plane port has no
#     business on the public interface;
#   - security headers are set here rather than in the application, because a
#     gateway that forwards everything unchanged is a gateway in name only.

http
{
    map $http_upgrade $connection_upgrade
    {
        default upgrade;
        '' close;
    }

    upstream app
    {
        server app:8080;
    }

    server
    {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Probes answer without a credential; the application enforces
        # authentication on everything else.
        location = /healthz
        {
            proxy_pass http://app;
            access_log off;
        }

        location /
        {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
            client_max_body_size 16m;
        }
    }
}
