name: CI

# Every branch is verified, not only pull requests: this repository is worked on
# by pushing to branches directly, and a gate that never runs there is how the
# tree drifted out of a passing state. Documentation-only changes skip the run.
on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: golangci-lint
        run: make linter-golangci

  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          fail_level: error
          reporter: github-pr-review
          yamllint_flags: '.'

  hadolint:
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-hadolint@v1
        with:
          fail_level: error
          reporter: github-pr-review

  dotenv-linter:
    name: runner / dotenv-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dotenv-linter/action-dotenv-linter@v3
        with:
          reporter: github-pr-review

  check-dependencies:
    name: runner / check-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: WriteGoList
        run: go list -json -m all > go.list
      - name: Nancy
        uses: sonatype-nexus-community/nancy-github-action@main
        continue-on-error: true

  unit-tests:
    name: runner / tests / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Unit Tests
        run: "make test"
      - name: Upload coverage report
        run: bash <(curl -s https://codecov.io/bash)

  agentos-architecture-guards:
    name: runner / agentos architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Import boundary guard
        run: "make check-import-boundary"
      - name: AgentOS schema freshness
        run: "make check-agentos-plan-schema"
      - name: Migration safety
        run: "make check-migration-safety"

  postgres-integration-tests:
    name: runner / tests / postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: goagent
          POSTGRES_PASSWORD: goagent
          POSTGRES_DB: goagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goagent -d goagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOAGENT_POSTGRES_TEST_URL: postgres://goagent:goagent@localhost:5432/goagent?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Postgres-backed AgentOS persistence integration tests
        run: "make postgres-integration-test"

  migration-drill:
    name: runner / migrations / drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: goagent
          POSTGRES_PASSWORD: goagent
          POSTGRES_DB: goagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goagent -d goagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DRILL_URL: postgres://goagent:goagent@localhost:5432/goagent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Apply, roll back and re-apply every migration
        run: "make migration-drill"

  integration-tests:
    name: runner / tests / integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the stack's development credentials
        # The repository ships no credentials, and the development stack
        # refuses to start without them, so each run makes its own.
        run: |
          cat > .env <<EOF
          CENTRIFUGO_API_KEY=$(openssl rand -hex 16)
          CENTRIFUGO_ADMIN_PASSWORD=$(openssl rand -hex 16)
          CENTRIFUGO_ADMIN_SECRET=$(openssl rand -hex 16)
          EOF
      - name: Integration tests
        run: "make compose-up-integration-test"

  workflow-determinism:
    name: runner / workflow determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determinism guard
        run: "make check-workflow-determinism"

  agentfw-validation:
    name: runner / tests / agentfw validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Load and soak suites
        run: "make agentfw-load-suite"
      - name: Security suites
        run: "make agentfw-security-suite"
