x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"

x-temporal-db-environment: &x-temporal-db-environment
  DB: "postgres12"
  DB_PORT: "5432"
  POSTGRES_USER: "user"
  POSTGRES_PWD: "myAwEsOm3pa55@w0rd"
  POSTGRES_SEEDS: "db"

x-rabbitmq-variables: &x-rabbitmq-variables
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "goagent"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55@w0rd@db:5432/db"
  # gRPC
  GRPC_PORT: "8081"
  # RMQ
  RMQ_RPC_SERVER: "rpc_server"
  RMQ_RPC_CLIENT: "rpc_client"
  RMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  # NATS
  NATS_RPC_SERVER: "rpc_server"
  NATS_URL: "nats://guest:guest@nats:4222/"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"


services:
  db:
    container_name: db
    image: postgres:18.3-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql/18/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      app_network:
        aliases:
          - db.lvh.me

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      app_network:
        aliases:
          - redis.lvh.me

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.5-management
    environment:
      <<: *x-rabbitmq-variables
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - rabbitmq.lvh.me

  nats:
    container_name: nats
    image: nats:2.12-alpine
    command: [ "-m", "8222", "-sd", "/nats-data", "-user", "guest", "-pass", "guest" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/nats-data
    networks:
      app_network:
        aliases:
          - nats.lvh.me

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.29.6
    restart: on-failure:6
    depends_on:
      db:
        condition: service_started
    environment:
      <<: *x-temporal-db-environment
      SQL_PASSWORD: "myAwEsOm3pa55@w0rd"
    volumes:
      - ./scripts/temporal/setup-postgres.sh:/scripts/setup.sh:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup.sh
    networks:
      app_network:
        aliases:
          - temporal-setup.lvh.me

  temporal:
    container_name: temporal
    image: temporalio/server:1.29.6.1
    restart: always
    depends_on:
      db:
        condition: service_started
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      <<: *x-temporal-db-environment
      BIND_ON_IP: "0.0.0.0"
      DYNAMIC_CONFIG_FILE_PATH: "config/dynamicconfig/development-sql.yaml"
    volumes:
    - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
      - "7233:7233"
      - "8233:8233"
    networks:
      app_network:
        aliases:
          - temporal.lvh.me

  temporal-create-namespace:
    container_name: temporal-create-namespace
    image: temporalio/admin-tools:1.29.6
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    volumes:
      - ./scripts/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    networks:
      app_network:
        aliases:
          - temporal-create-namespace.lvh.me
  #   container_name: temporal-ui
  #   depends_on:
  #     temporal:
  #       condition: service_healthy
  #   environment:
  #     - TEMPORAL_ADDRESS=temporal:7233
  #     - TEMPORAL_CORS_ORIGINS=http://localhost:3000
  #   image: temporalio/ui::2.49.1
  #   networks:
  #     app_network:
  #       aliases:
  #         - temporal-ui.lvh.me
  #   ports:
  #     - "8083:8083"
  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.29.7-alpine
    restart: on-failure:5
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - rabbitmq
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
  rabbitmq_data:
  nats_data:
