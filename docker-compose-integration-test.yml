services:
  mock-llm:
    container_name: mock-llm
    platform: linux/amd64
    build:
      context: ./integration-test/mock-llm
      dockerfile: Dockerfile
    ports:
      - "18082:8080"
    networks:
      app_network:
        aliases:
          - mock-llm.lvh.me

  mock-agent-backends:
    container_name: mock-agent-backends
    platform: linux/amd64
    build:
      context: .
      dockerfile: integration-test/mock-agent-backends/Dockerfile
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "default"
      TEMPORAL_TASK_QUEUE: "mock-agent-backends"
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
    ports:
      - "18080:8080"
      - "19090:9090"
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      app_network:
        aliases:
          - mock-agent-backends.lvh.me

  migrate:
    container_name: migrate
    platform: linux/amd64
    build:
      context: .
      args:
        TARGET: agentos-migrate
    environment:
      PG_URL: "postgres://user@db:5432/db"
      AGENTOS_MIGRATIONS_URL: "file://migrations"
    depends_on:
      db:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - migrate.lvh.me

  app:
    restart: always
    environment:
      REDIS_URL: "redis://redis:6379"
      AGENTFW_ENABLED: "true"
      AGENTFW_TEMPORAL_ADDRESS: "temporal:7233"
      AGENTFW_TEMPORAL_PLAN_CONTROL_TASK_QUEUE: "agentos-plan-control"
      AGENTFW_TEMPORAL_PLAN_ACTIVITY_TASK_QUEUE: "agentos-plan-activity"
      AGENTFW_TEMPORAL_PROCESS_CONTROL_TASK_QUEUE: "agentos-process-control"
      AGENTFW_TEMPORAL_PROCESS_ACTIVITY_TASK_QUEUE: "agentos-process-activity"
      AGENTFW_TEMPORAL_NATIVE_CONTROL_TASK_QUEUE: "agentfw-native-control"
      AGENTFW_TEMPORAL_NATIVE_LLM_TASK_QUEUE: "agentfw-native-llm"
      AGENTFW_TEMPORAL_NATIVE_TOOL_TASK_QUEUE: "agentfw-native-tool"
      AGENTFW_TEMPORAL_STREAM_TASK_QUEUE: "agentfw-stream"
      AGENTFW_TEMPORAL_NEXUS_TASK_QUEUE: "agentos-nexus"
      AGENTFW_LLM_CONFIG_PATH: "/config/llm.yaml"
      # Cross-town ingress: one probe route so the suite can lock the bridge end
      # to end (integration-test/ingress_test.go). The workflow type is
      # deliberately unstaffed — what the bridge owes is the delivery into
      # Temporal, and a started execution is that delivery.
      AGENTFW_INGRESS_ROUTES_JSON: '[{"domain":"run.timeline","type":"cross.city.probe","workflow_type":"crossCityIngressProbe","signal_name":"fact"}]'
      AGENTFW_INGRESS_TASK_QUEUE: "cross-city-probe"
      AGENTFW_TEMPORAL_EXTERNAL_BACKENDS_JSON: '[{"name":"mock-temporal","task_queue":"mock-agent-backends","workflow_type":"MockAgentWorkflow","query_type":"agentos.run.status","signals":{"cancel":"agentos.control.cancel"}}]'
      AGENTFW_HTTP_BACKENDS_JSON: '[{"name":"mock-http","endpoint":"http://mock-agent-backends:8080"}]'
      AGENTFW_GRPC_BACKENDS_JSON: '[{"name":"mock-grpc","target":"mock-agent-backends:9090","insecure":true}]'
      AGENTOS_CAPABILITIES_JSON: '[{"backend":{"kind":"temporal_external","name":"mock-temporal"},"name":"run","controls":["cancel"]},{"backend":{"kind":"http","name":"mock-http"},"name":"run","controls":["pause","resume","cancel"]},{"backend":{"kind":"grpc","name":"mock-grpc"},"name":"run","controls":["pause","resume","cancel"]}]'
    volumes:
      - "./integration-test/mock-llm/llm-config.yaml:/config/llm.yaml"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      nats:
        condition: service_healthy
      nats-create-streams:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      mock-llm:
        condition: service_started
      mock-agent-backends:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - app.lvh.me

  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    environment:
      # The suite authenticates like any other client: it mints HS256 tokens
      # from these values, so they must match the app's auth configuration
      # (x-backend-app-environment in docker-compose.dev.yml). Drift surfaces as
      # a 401 on every protected route, not as a check that quietly passes.
      AUTH_HMAC_SECRET: "${AUTH_HMAC_SECRET:-dev-only-shared-secret-not-for-production}"
      AUTH_ISSUER: "${AUTH_ISSUER:-goagent-dev}"
      AUTH_AUDIENCE: "${AUTH_AUDIENCE:-goagent}"
      PG_URL: "postgres://user@db:5432/db"
      GO_TEST_FLAGS: "${GO_TEST_FLAGS:--v}"
      GO_TEST_PACKAGES: "${GO_TEST_PACKAGES:-./integration-test/...}"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      mock-llm:
        condition: service_started
      mock-agent-backends:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - test.lvh.me


networks:
  app_network:
    external: false
